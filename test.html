e;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:90vh;overflow:auto;background:#111;border:1px solid #333;border-radius:18px}.dh{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}.dh h2{margin:0}.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#ddd}.field input,.field textarea,.field select{background:#080808;color:#fff;border:1px solid #343434;border-radius:10px;padding:11px}.field textarea{min-height:100px}.upload-box{border:1px dashed #555;border-radius:12px;padding:14px;background:#0a0a0a;display:grid;gap:10px}.upload-box input[type=file]{padding:9px;background:#151515}.upload-preview{display:flex;gap:10px;flex-wrap:wrap}.upload-preview img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #333}.upload-status{font-size:12px;color:#d9a7b4}.upload-hint{font-size:11px;color:var(--muted)}.df{display:flex;justify-content:flex-end;gap:10px;padding:15px 18px;border-top:1px solid var(--line)}.notice{background:#251318;border:1px solid #743047;color:#efb3c3;padding:14px;border-radius:12px;margin-bottom:18px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:16px}.form{grid-template-columns:1fr}.full{grid-column:auto}.top{flex-direction:column}}</style></head><body><div class="layout"><aside class="side"><div class="brand">لوحة تحكم البورتفوليو</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">لوحة التحكم</h1></div><a class="btn light" href="index.html" target="_blank">معاينة البورتفوليو</a></div><section id="content"></section></main></div><div class="modal" id="modal"><div class="dialog"><div class="dh"><h2 id="modalTitle window.PORTFOLIO_SUPABASE={url:"https://jccfspatlesnbxogawot.supabase.co",anonKey:"sb_publishable_96-jvdHuBASWwVLb7_Nkug_AY03yXcU"};
const cfg=window.PORTFOLIO_SUPABASE;if(cfg.url.includes('YOUR_'))alert('أضف رابط Supabase ومفتاح anon داخل ملف dashboard.html.');const sb=supabase.createClient(cfg.url,cfg.anonKey);
const defs={

services:{label:'الخدمات',fields:[['title','العنوان','text'],['description','الوصف','textarea'],['sort_order','الترتيب','number'],['is_active','مفعّل','checkbox']]},

case_studies:{label:'دراسات الحالة',fields:[['project_name','اسم المشروع','text'],['business_type','نوع النشاط','text'],['goal','الهدف','textarea'],['platform','المنصة','text'],['budget','الميزانية','text'],['strategy','الاستراتيجية','textarea'],['results','النتائج','textarea'],['image_url','الصورة الرئيسية','image'],['screenshots','صور إضافية','images'],['sort_order','الترتيب','number'],['is_active','مفعّل','checkbox']]},

social_links:{label:'روابط التواصل',fields:[['label','اسم الرابط','text'],['url','الرابط','text'],['sort_order','الترتيب','number'],['is_active','مفعّل','checkbox']]},

let current='site_settings',rows=[],editId=null;const nav=document.getElementById('nav'),content=document.getElementById('content');Object.entries(defs).forEach(([k,d],i)=>{const b=document.createElement('button');b.textContent=d.label;b.className=i?'':'active';b.onclick=()=>openSection(k,b);nav.appendChild(b)});async function openSection(k,b){current=k;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b&&b.classList.add('active');title.textContent=defs[k].label;await load()}
async function load(){const d=defs[current];let query=sb.from(current).select('*');if(!d.settings&&!d.readonly)query=query.order('sort_order');else if(d.readonly)query=query.order('created_at',{ascending:false});const{data,error}=await query;if(error){content.innerHTML=`<div class="notice">${error.message}</div>`;return}rows=data||[];render()}
function render(){const d=defs[current];const cols=d.fields.map(x=>x[0]);content.innerHTML=`<div class="card"><div class="toolbar"><strong>${d.label}</strong>${d.readonly?'':`<button class="btn primary" onclick="openModal()">إضافة جديد</button>`}</div><div class="tableWrap">${rows.length?`<table><thead><tr>${cols.slice(0,4).map(c=>`<th>${c}</th>`).join('')}<th>الإجراءات</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.slice(0,4).map(c=>`<td>${format(r[c])}</td>`).join('')}<td><div class="actions">${d.readonly?'':`<button class="btn light" onclick='openModal(${JSON.stringify(r).replace(/'/g,"&#39;")})'>تعديل</button>`}<button class="btn danger" onclick="removeRow('${r.id??r.key}')">حذف</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty">لا توجد بيانات حتى الآن.</div>`}</div></div>`}
function format(v){if(typeof v==='boolean')return v?'نعم':'لا';if(Array.isArray(v))return `${v.length} صور`;return String(v??'').slice(0,90)}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function openModal(row=null){editId=row?(defs[current].settings?row.key:row.id):null;modalTitle.textContent=row?'تعديل العنصر':'إضافة عنصر';fields.innerHTML=defs[current].fields.map(f=>fieldHtml(f,row||{})).join('');modal.classList.add('open')}
function fieldHtml([name,label,type,options],r){const v=r[name]??(type==='checkbox'?true:'');
if(type==='image'){return `<div class="field full"><label>${label}</label><div class="upload-box"><input type="file" name="${name}_file" accept="image/*"><input type="hidden" name="${name}" value="${esc(v)}"><div class="upload-preview">${v?`<img src="${esc(v)}" alt="معاينة">`:''}</div><div class="upload-hint">اختر صورة من جهازك. عند الحفظ سيتم رفعها تلقائيًا.</div></div></div>`}
if(type==='images'){let arr=Array.isArray(v)?v:(typeof v==='string'&&v? v.split('\n').filter(Boolean):[]);return `<div class="field full"><label>${label}</label><div class="upload-box"><input type="file" name="${name}_files" accept="image/*" multiple><input type="hidden" name="${name}" value='${esc(JSON.stringify(arr))}'><div class="upload-preview">${arr.map(x=>`<img src="${esc(x)}" alt="معاينة">`).join('')}</div><div class="upload-hint">يمكن اختيار أكثر من صورة مرة واحدة. الصور الجديدة تُضاف إلى الصور الحالية.</div></div></div>`}
if(type==='textarea')return `<div class="field full"><label>${label}</label><textarea name="${name}">${esc(v)}</textarea></div>`;if(type==='select')return `<div class="field"><label>${label}</label><select name="${name}">${options.split('|').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`;if(type==='checkbox')return `<div class="field"><label><input name="${name}" type="checkbox" ${v?'checked':''}> ${label}</label></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(v)}"></div>`}
function closeModal(){modal.classList.remove('open');form.reset()}
async function uploadFile(file,folder){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const safe=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const path=`${folder}/${safe}`;const{error}=await sb.storage.from('portfolio-images').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;return sb.storage.from('portfolio-images').getPublicUrl(path).data.publicUrl}
form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('[type=submit]');submit.disabled=true;submit.textContent='جارٍ الحفظ...';try{const d=defs[current],fd=new FormData(form),payload={};for(const [n,l,t] of d.fields){if(t==='checkbox')payload[n]=fd.has(n);else if(t==='number')payload[n]=Number(fd.get(n))||0;else if(t==='image'){const file=fd.get(`${n}_file`);payload[n]=(file&&file.size)?await uploadFile(file,current):fd.get(n)}else if(t==='images'){let currentImages=[];try{currentImages=JSON.parse(fd.get(n)||'[]')}catch{}const files=[...form.querySelector(`[name="${n}_files"]`).files];const uploaded=[];for(const file of files)uploaded.push(await uploadFile(file,current));payload[n]=[...currentImages,...uploaded]}else payload[n]=fd.get(n)}let res;if(editId!=null)res=await sb.from(current).update(payload).eq(d.settings?'key':'id',editId);else res=await sb.from(current).insert(payload);if(res.error)throw res.error;closeModal();await load()}catch(err){alert(`تعذر الحفظ: ${err.message||err}`)}finally{submit.disabled=false;submit.textContent='حفظ'}};async function removeRow(id){if(!confirm('هل تريد حذف هذا العنصر؟'))return;const d=defs[current],{error}=await sb.from(current).delete().eq(d.settings?'key':'id',id);if(error)return alert(error.message);load()}load();
