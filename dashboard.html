<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم البورتفوليو</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#111827;--muted:#667085;--line:#e4e7ec;--primary:#2563eb;--danger:#dc2626;--green:#16a34a;--sidebar:#101828;--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:var(--sidebar);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:900;padding:0 10px 22px;border-bottom:1px solid #ffffff1c;margin-bottom:16px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:right;padding:11px 13px;border-radius:12px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:#ffffff14;color:#fff}.main{padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.topbar p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#fff;border:1px solid var(--line)}.btn-danger{background:#fee2e2;color:var(--danger)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 8px 30px #1018280a}.toolbar{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.toolbar input{max-width:320px;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:14px 16px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}.data-table th{font-size:12px;color:var(--muted);background:#fcfcfd}.data-table td{font-size:14px}.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#eef2f6}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.badge-on{background:#dcfce7;color:#166534}.badge-off{background:#f2f4f7;color:#475467}.row-actions{display:flex;gap:7px}.icon-btn{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:9px;cursor:pointer}.empty{padding:50px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#101828b8;display:none;place-items:center;padding:20px;z-index:50}.modal.open{display:grid}.dialog{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:22px}.dialog-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:21px}.close{border:0;background:#f2f4f7;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px #2563eb14}.upload-row{display:flex;gap:8px}.upload-row input{flex:1}.dialog-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.toast{position:fixed;left:24px;bottom:24px;background:#101828;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:80}.toast.show{display:block}.setup{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:16px;border-radius:14px;margin-bottom:18px;display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.summary .card{padding:18px}.summary strong{font-size:28px;display:block}.summary span{color:var(--muted);font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:static}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:18px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.summary{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar"><div class="brand">لوحة تحكم البورتفوليو</div><div class="nav" id="nav"></div></aside>
<main class="main"><div class="setup" id="setup">أضف بيانات Supabase داخل إعدادات الاتصال الموجودة أسفل ملف <b>dashboard.html</b>.</div><div class="topbar"><div><h1 id="pageTitle">المحتوى العام</h1><p id="pageDesc">إدارة محتوى الموقع من مكان واحد.</p></div><div class="actions"><a class="btn btn-light" href="index.html" target="_blank">معاينة الموقع</a><button class="btn btn-primary" id="addBtn">إضافة جديد</button></div></div><div class="summary" id="summary"></div><section class="panel active"><div class="card"><div class="toolbar"><input id="search" placeholder="بحث داخل القسم..."><button class="btn btn-light" id="refreshBtn">تحديث</button></div><div class="table-wrap" id="content"></div></div></section></main>
</div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">إضافة</h2><button class="close" id="closeModal">×</button></div><form id="form"><div class="form" id="fields"></div><div class="dialog-foot"><button type="button" class="btn btn-light" id="cancelBtn">إلغاء</button><button class="btn btn-primary" id="saveBtn">حفظ</button></div></form></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.PORTFOLIO_SUPABASE = {
  url: "https://jccfspatlesnbxogawot.supabase.co",
  anonKey: "sb_publishable_96-jvdHuBASWwVLb7_Nkug_AY03yXcU"
};

const cfg=window.PORTFOLIO_SUPABASE||{};const ready=cfg.url&&!cfg.url.includes('YOUR_')&&cfg.anonKey&&!cfg.anonKey.includes('YOUR_');const db=ready?window.supabase.createClient(cfg.url,cfg.anonKey):null;
const sections={
site_settings:{label:'المحتوى العام',desc:'النصوص والصور الرئيسية وبيانات التواصل.',pk:'key',settings:true,fields:[['key','اسم الحقل','text',true],['value','القيمة','textarea',true]]},
stats:{label:'الإحصائيات',desc:'الأرقام الظاهرة أعلى الموقع.',fields:[['value','القيمة','number',true],['prefix','بادئة الرقم','text'],['suffix','لاحقة الرقم','text'],['label','الوصف','text',true],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
clients:{label:'العملاء',desc:'أسماء أو شعارات العملاء.',fields:[['name','اسم العميل','text',true],['logo_url','رابط الشعار','image'],['url','رابط العميل','url'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
services:{label:'الخدمات',desc:'الخدمات والمميزات التابعة لها.',fields:[['title','العنوان','text',true],['description','الوصف','textarea',true],['features','المميزات JSON','json'],['icon_svg','كود SVG','textarea'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
platforms:{label:'المنصات',desc:'تبويبات منصات الحملات.',fields:[['name','اسم التبويب','text',true],['badge','العلامة','text'],['title','العنوان','text'],['description','الوصف','textarea'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
campaigns:{label:'الحملات',desc:'صور الحملات المرتبطة بكل منصة.',fields:[['platform_id','المنصة','relation:platforms',true],['title','عنوان الحملة','text',true],['caption','النص على الصورة','text'],['image_url','الصورة','image',true],['alt_text','وصف الصورة','text'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
case_studies:{label:'دراسات الحالة',desc:'نتائج ومؤشرات دراسات الحالة.',fields:[['category_slug','معرّف التصنيف','text',true],['category_name','اسم التصنيف','text',true],['tag','الوسم','text'],['title','العنوان','text',true],['description','الوصف','textarea',true],['image_url','الصورة','image',true],['metrics','النتائج JSON','json'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
process_steps:{label:'خطوات العمل',desc:'مراحل وطريقة العمل.',fields:[['title','العنوان','text',true],['description','الوصف','textarea',true],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
tools:{label:'الأدوات',desc:'الأدوات والمنصات المستخدمة.',fields:[['name','اسم الأداة','text',true],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
testimonials:{label:'آراء العملاء',desc:'التقييمات وآراء العملاء.',fields:[['quote','الرأي','textarea',true],['name','الاسم','text',true],['role','الصفة','text'],['avatar_url','الصورة الشخصية','image'],['rating','التقييم من 5','number'],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
social_links:{label:'السوشيال',desc:'روابط حسابات التواصل الاجتماعي.',fields:[['label','اسم المنصة','text',true],['url','الرابط','url',true],['sort_order','الترتيب','number'],['is_active','ظاهر بالموقع','boolean']]},
leads:{label:'طلبات التواصل',desc:'الطلبات المرسلة من نموذج الموقع.',readonly:true,fields:[['name','الاسم','text'],['business_type','نوع النشاط','text'],['monthly_budget','الميزانية','text'],['goal','الهدف','textarea'],['created_at','التاريخ','text']]}
};
let current='site_settings',rows=[],editing=null,relations={};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function nav(){ $('#nav').innerHTML=Object.entries(sections).map(([k,v])=>`<button data-section="${k}" class="${k===current?'active':''}">${v.label}</button>`).join('');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{current=b.dataset.section;editing=null;nav();load()})}
async function load(){const s=sections[current];$('#pageTitle').textContent=s.label;$('#pageDesc').textContent=s.desc;$('#addBtn').style.display=s.readonly?'none':'inline-flex';if(!ready){$('#setup').style.display='block';$('#content').innerHTML='<div class="empty">لم يتم ربط Supabase بعد.</div>';return}$('#setup').style.display='none';let q=db.from(current).select('*');if(current!=='site_settings')q=q.order(current==='leads'?'created_at':'sort_order',{ascending:current!=='leads'});const {data,error}=await q;if(error)return toast(error.message);rows=data||[];await loadRelations();render();summary()}
async function loadRelations(){relations={};for(const f of sections[current].fields){if(String(f[2]).startsWith('relation:')){const t=f[2].split(':')[1];const {data}=await db.from(t).select('id,name').order('sort_order');relations[f[0]]=data||[]}}}
function summary(){const active=rows.filter(r=>r.is_active!==false).length;$('#summary').innerHTML=`<div class="card"><strong>${rows.length}</strong><span>إجمالي العناصر</span></div><div class="card"><strong>${active}</strong><span>عناصر ظاهرة/متاحة</span></div><div class="card"><strong>${sections[current].readonly?'عرض فقط':'إضافة وتعديل وحذف'}</strong><span>صلاحيات القسم</span></div>`}
function mainValue(r){for(const k of ['title','name','label','key','quote','goal'])if(r[k])return r[k];return r.id||''}
function render(){const term=$('#search').value.trim().toLowerCase();const list=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term));if(!list.length){$('#content').innerHTML='<div class="empty">لا توجد عناصر.</div>';return}const imageKeys=['image_url','logo_url','avatar_url','profile_image_url'];$('#content').innerHTML=`<table class="data-table"><thead><tr><th>العنصر</th><th>صورة</th><th>الترتيب</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${list.map(r=>{const ik=imageKeys.find(k=>r[k]);return `<tr><td><b>${esc(mainValue(r)).slice(0,100)}</b><br><small>${esc(r.description||r.role||r.business_type||'').slice(0,120)}</small></td><td>${ik?`<img class="thumb" src="${esc(r[ik])}">`:'—'}</td><td>${r.sort_order??'—'}</td><td>${r.is_active===false?'<span class="badge badge-off">مخفي</span>':'<span class="badge badge-on">نشط</span>'}</td><td><div class="row-actions">${sections[current].readonly?'':`<button class="icon-btn" onclick="editRow('${esc(r[sections[current].pk||'id'])}')">تعديل</button>`}<button class="icon-btn" onclick="deleteRow('${esc(r[sections[current].pk||'id'])}')">حذف</button></div></td></tr>`}).join('')}</tbody></table>`}
function fieldHtml(f,val){const [name,label,type,required]=f;const req=required?'required':'';if(type==='boolean')return `<div class="field"><label>${label}</label><select name="${name}"><option value="true" ${val!==false?'selected':''}>نعم</option><option value="false" ${val===false?'selected':''}>لا</option></select></div>`;if(type==='textarea'||type==='json')return `<div class="field full"><label>${label}</label><textarea name="${name}" ${req}>${esc(type==='json'&&typeof val==='object'?JSON.stringify(val,null,2):(val??''))}</textarea></div>`;if(type==='image')return `<div class="field full"><label>${label}</label><div class="upload-row"><input name="${name}" type="url" value="${esc(val||'')}" ${req}><button type="button" class="btn btn-light" onclick="uploadImage('${name}')">رفع صورة</button></div><input id="file-${name}" type="file" accept="image/*" hidden></div>`;if(type.startsWith('relation:'))return `<div class="field"><label>${label}</label><select name="${name}" ${req}><option value="">اختر</option>${(relations[name]||[]).map(x=>`<option value="${x.id}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val??'')}" ${req}></div>`}
function openForm(row=null){editing=row;const s=sections[current];$('#modalTitle').textContent=row?'تعديل العنصر':'إضافة عنصر';$('#fields').innerHTML=s.fields.map(f=>fieldHtml(f,row?.[f[0]])).join('');$('#modal').classList.add('open')}
function close(){ $('#modal').classList.remove('open');editing=null }
window.editRow=id=>{const pk=sections[current].pk||'id';openForm(rows.find(r=>String(r[pk])===String(id)))};
window.deleteRow=async id=>{if(!confirm('هل تريد حذف هذا العنصر؟'))return;const pk=sections[current].pk||'id';const {error}=await db.from(current).delete().eq(pk,id);if(error)return toast(error.message);toast('تم الحذف');load()};
window.uploadImage=async name=>{const input=$(`#file-${name}`);input.click();input.onchange=async()=>{const file=input.files[0];if(!file)return;const ext=file.name.split('.').pop();const path=`${current}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;toast('جارٍ رفع الصورة...');const {error}=await db.storage.from('portfolio-media').upload(path,file,{upsert:false});if(error)return toast(error.message);const {data}=db.storage.from('portfolio-media').getPublicUrl(path);document.querySelector(`[name="${name}"]`).value=data.publicUrl;toast('تم رفع الصورة')}};
$('#form').onsubmit=async e=>{e.preventDefault();const s=sections[current],fd=new FormData(e.currentTarget),payload={};for(const f of s.fields){let v=fd.get(f[0]);if(f[2]==='boolean')v=v==='true';if(f[2]==='number')v=v===''?0:Number(v);if(f[2]==='json'){try{v=v?JSON.parse(v):[]}catch{return toast(`صيغة JSON غير صحيحة في ${f[1]}`)}}payload[f[0]]=v??''}const pk=s.pk||'id';let res;if(editing){if(current==='site_settings'&&payload.key!==editing.key){await db.from(current).delete().eq('key',editing.key)}res=await db.from(current).upsert(payload)}else res=await db.from(current).insert(payload);if(res.error)return toast(res.error.message);close();toast('تم الحفظ بنجاح');load()};
$('#addBtn').onclick=()=>openForm();$('#closeModal').onclick=close;$('#cancelBtn').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#refreshBtn').onclick=load;$('#search').oninput=render;nav();load();
</script>
</body></html>
